<!-- Une ligne de playlist : le rang à gauche, le morceau au milieu, la durée à droite -->
<article [class.current]="isCurrent()" class="card">
  <span class="rank">#{{ rank() }}</span>

  <div class="song">
    <h2 class="song__title">{{ track().title }}</h2>
    <p class="song__artist">{{ track().artist }}</p>
  </div>

  <!-- « Durée » reste écrit en toutes lettres : « 3:05 » seul serait ambigu à l'oreille -->
  <p class="duration">
    <span class="duration__label">Durée</span>
    <span class="duration__value">{{ formattedDuration() }}</span>
  </p>
  <button type="button" (click)="requestRemove()" [aria-label]="'Retirer ' + track().title">
    Retirer
  </button>
  <button type="button" (click)="requestPlay()" [aria-label]="'Lire ' + track().title">Lire</button>
  <button
    type="button"
    (click)="requestToggleLike()"
    [aria-label]="likeLabel() + ' ' + track().title"
  >
    {{ likeLabel() }}
  </button>
</article>
