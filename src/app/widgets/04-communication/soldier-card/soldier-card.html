<!-- [class.compact] : la carte se resserre en vue compacte (moins de marges) -->
<article class="card" [class.compact]="compact()">
  <span class="soldier-name">{{ soldier().name }}</span>

  <!-- La santé : la barre et le chiffre côte à côte. Le chiffre permet de lire la valeur
       sans deviner la longueur de la barre -->
  <div class="health">
    <div
      class="progress"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="soldier().health"
      [attr.aria-label]="'Santé du soldat : ' + soldier().name"
    >
      <div class="progress__fill" [style.width.%]="soldier().health"></div>
    </div>
    <!-- aria-hidden : le lecteur d'écran a déjà la valeur grâce à aria-valuenow -->
    <span class="health__value" aria-hidden="true">{{ soldier().health }} %</span>
  </div>

  <!-- Les détails, cachés en vue compacte. Le statut n'a pas d'aria-hidden : il n'est donné
       nulle part ailleurs -->
  @if (!compact()) {
    <div class="details">
      <p class="soldier-role">{{ soldier().role }}</p>
      <span class="health__status">{{ healthStatus() }}</span>
      <!-- [class.deployment--active] : l'étiquette passe en orange quand le soldat est en mission -->
      <span class="deployment" [class.deployment--active]="soldier().deployed">
        Statut : {{ deploymentStatus() }}
      </span>
    </div>
  }

  <!-- Les actions : regroupées en bas de la carte. Chaque aria-label commence par le texte
       visible du bouton, puis précise le soldat (« Soigner Sergent Bleu ») -->
  <div class="actions">
    <button type="button" (click)="requestHeal()" [aria-label]="'Soigner ' + soldier().name">
      Soigner
    </button>
    <button
      type="button"
      (click)="requestToggleDeploy()"
      [aria-label]="deployLabel() + ' ' + soldier().name"
    >
      {{ deployLabel() }}
    </button>
    <button type="button" (click)="requestDismiss()" [aria-label]="'Renvoyer ' + soldier().name">
      Renvoyer
    </button>
  </div>
</article>
